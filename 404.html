<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AskMosh</title>
<script>
// mosheginzy.com moved to askmosh.com. Send every old address to the same page there (path, query, hash),
// and the first time, carry the visitor's saved settings (name, id, language, history) along in the hash
// so askmosh-migrate.js on the new site can restore them.
(function(){
  var target='https://askmosh.com'+location.pathname+location.search;
  var hash=location.hash||'';
  try{
    if(!localStorage.getItem('mg-moved-to-askmosh')){
      var data={},n=0;
      for(var i=0;i<localStorage.length;i++){
        var k=localStorage.key(i),v=localStorage.getItem(k);
        if(v!==null&&v.length<20000){data[k]=v;n++;}
      }
      if(n){
        var packed=encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(data)))));
        if(packed.length<60000){
          localStorage.setItem('mg-moved-to-askmosh','1');
          location.replace(target+'#mgmig='+packed+(hash?'&h='+encodeURIComponent(hash):''));
          return;
        }
      }
    }
  }catch(e){}
  location.replace(target+hash);
})();
</script>
<link rel="canonical" href="https://askmosh.com/">
<style>body{margin:0;background:#0F2236;color:#F4F1EA;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}a{color:#D4AF5E}</style>
</head>
<body>
<p>עברנו לכתובת חדשה: <a href="https://askmosh.com/">askmosh.com</a></p>
</body>
</html>
